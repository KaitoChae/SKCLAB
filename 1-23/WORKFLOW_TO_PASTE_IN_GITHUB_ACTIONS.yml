name: Refresh publications, translations, and research projects

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '1-23/scripts/**'
      - '1-23/requirements.txt'
      - '.github/workflows/update-research-data.yml'

permissions:
  contents: write

concurrency:
  group: lab-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install updater requirements
        run: pip install -r 1-23/requirements.txt

      - name: Refresh publication index, translations and publication visuals
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python 1-23/scripts/update_publications.py

      - name: Refresh research projects from the official ITB staff profile
        run: python 1-23/scripts/update_research_projects.py

      - name: Refresh SCImago quartiles and SJR plus verified Impact Factors
        env:
          JCR_JSON_URL: ${{ secrets.JCR_JSON_URL }}
        run: python 1-23/scripts/update_journal_metrics.py

      - name: Commit refreshed research data
        run: |
          git config user.name "lab-publication-bot"
          git config user.email "actions@users.noreply.github.com"
          git add 1-23/data/publications.json 1-23/data/publications.js 1-23/data/research_projects.json 1-23/data/research_projects.js 1-23/assets/publications
          git diff --cached --quiet || git commit -m "Auto-update publications, translations, and research projects"
          git pull --rebase
          git push
